<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/custom_elements.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/pokemon_card.css">
    <link rel="stylesheet" href="styles/pokemon_types.css">
    <link rel="stylesheet" href="styles/pokemon_details_dialog.css">
    <link rel="stylesheet" href="styles/loader.css">


    <link rel="shortcut icon" href="assets/icons/red-team.png" type="image/x-icon">

    <script src="scripts/constants.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/init.js"></script>
    <script src="scripts/pokeapi.js"></script>
    <script src="scripts/templates.js"></script>
    <script src="scripts/cache.js"></script>
    <script src="scripts/render.js"></script>
    <script src="scripts/filter.js"></script>
    <script src="scripts/pokemon_details_dialog.js"></script>
    <script src="scripts/loader.js"></script>
    <script src="scripts/event_handler.js"></script>
</head>

<body onload="initializeAsync()">
    <header id="pageHeader" class="page_header">
        <div class="page_heading">
            <img class="logo" src="assets/icons/red-team.png" alt="A Pokédex.">
            <h1>Pokédex</h1>
        </div>

        <div class="filter_wrapper">
            <input id="filterInput" type="text" placeholder="Filter shown Pokémon..."
                onkeypress="filterPokemonCardsOnEnterAsync(event)">
            <button id="filterButton" onclick="filterPokemonCardsAsync()">
                <img src="assets/icons/magnifying-glass.svg" alt="A magnifying glass.">
            </button>
        </div>
    </header>

    <main>
        <section id="cardsSection" class="cards_section">
            <div id="pokemonCardsWrapper" class="cards_wrapper">

            </div>

            <div id="mainListLoader" class="loader">
                <img src="assets/icons/pokeball.svg" alt="A pokeball.">
            </div>

            <button id="loadPokemonButton" onclick="downloadAndRenderNextPokemon()">
                <p>Load next</p>
                <input id="loadPokemonInput" type="number" value="20" min="1" onclick="loadPokemonInputClicked(event)"
                    onkeypress="loadPokemonInputKeyPressed(event)">
                <p>Pokémon</p>
            </button>

            <a href="./index.html#pageHeader" class="scroll_to_top_link circle_button">
                <img src="./assets/icons/scroll_up.png" alt="An arrow pointing upwards.">
            </a>
        </section>

        <dialog id="pokemonDetailsLoaderDialog" class="loader_dialog" disabled closedby="none">
            <img src="assets/icons/pokeball.svg" alt="A pokeball.">
        </dialog>

        <dialog id="pokemonDetailsDialog" class="pokemon_details_dialog" closedby="any">
            <div id="detailsDialogPokemonImageWrapper" class="details_dialog_pokemon_image_wrapper">
                <button class="circle_button" onclick="showPreviousPokemonDetailsAsync()">
                    <img src="../assets/icons/lower_than.png" alt="A lower-than symbol.">
                </button>

                <img id="detailsPokemonMainImage">

                <button class="circle_button" onclick="showNextPokemonDetailsAsync()">
                    <img src="../assets/icons/greater_than.png" alt="A greater-than symbol.">
                </button>
            </div>

            <div class="base_infos_wrapper">
                <div>
                    <p id="detailsPokedexNumber"></p>
                    <h2 id="detailsPokemonName"></h2>
                    <div id="detailsPokemonTypesWrapper">
                    </div>
                </div>

                <div class="pokemon_details">
                    <p>In-game sprites</p>
                    <div id="pokemonGenderWrapper">
                    </div>
                </div>
            </div>

            <p id="pokemonFlavorText"></p>

            <div class="pokemon_details_wrapper">
                <div class="pokemon_details_wrapper_column">
                    <div class="pokemon_details">
                        <p class="pokemon_details_headline">Height</p>
                        <p id="pokemonHeight"></p>
                    </div>
                    <div class="pokemon_details">
                        <p class="pokemon_details_headline">Weight</p>
                        <p id="pokemonWeight"></p>
                    </div>
                </div>
                <div pokemon_details_wrapper_column>
                    <div class="pokemon_details">
                        <p class="pokemon_details_headline">Abilities</p>
                        <div id="pokemonAbilitiesWrapper">
                        </div>
                    </div>
                </div>
            </div>

            <div class="stats_wrapper">
                <label for="pokemonStatsTable">Base stats</label>
                <table id="pokemonStatsTable">
                </table>
            </div>

        </dialog>
    </main>

    <footer class="page_footer">
        <p>© 2026 Joshua Masur</p>
        <p>Data provided by <a href="https://pokeapi.co/" target="_blank">PokéAPI</a></p>
    </footer>
</body>

</html>
