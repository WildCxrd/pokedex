<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/pokemon_card.css">
    <link rel="stylesheet" href="styles/pokemon_types.css">

    <link rel="shortcut icon" href="assets/img/red-team.png" type="image/x-icon">

    <script src="scripts/init.js"></script>
    <script src="scripts/pokeapi.js"></script>
    <script src="scripts/templates.js"></script>
    <script src="scripts/cashe.js"></script>
    <script src="scripts/render.js"></script>
    <script src="scripts/filter.js"></script>
</head>

<body onload="initialize()">
    <header class="page_header">
        <div class="page_heading">
            <img class="logo" src="assets/img/red-team.png" alt="A Pokédex.">
            <h1>Pokédex</h1>
        </div>

        <div class="filter_wrapper">
            <input id="filterInput" type="text" placeholder="Search for a Pokémon..." onkeypress="filterPokemonCardsOnEnter(event)">
            <button id="filterButton">
                <img src="assets/icons/magnifying-glass.svg" alt="A magnifying glass." onclick="filterPokemonCards()">
            </button>
        </div>
    </header>

    <main>
        <section id="pokemonCardsSection" class="cards_section">
        </section>
    </main>

    <footer class="page_footer">
        <p>© 2026 Joshua Masur</p>
        <p>Data provided by <a href="https://pokeapi.co/" target="_blank">PokéAPI</a></p>
    </footer>
</body>

</html>
